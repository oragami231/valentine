<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine? ❤️</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .card {
      background: rgba(0, 0, 0, 0.25);
      padding: 30px;
      border-radius: 15px;
      max-width: 350px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }

    .yes {
      background: #4CAF50;
      color: white;
    }

    .no {
      background: #f44336;
      color: white;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="question">
    <h1>Hey ❤️</h1>
    <p>Will you be my Valentine? 🌹</p>
    <button class="yes" onclick="yesClicked()">Yes 💖</button>
    <button class="no" onclick="noClicked()">No 🙈</button>
  </div>

  <div class="card hidden" id="yesMessage">
    <h1>YAY!!! 💕</h1>
    <p>You just made my day 🥰<br>Happy Valentine’s ❤️</p>
  </div>

  <div class="card hidden" id="noMessage">
    <h1>Oh 😅</h1>
    <p>That’s okay… you’re still amazing 💙</p>
  </div>

  <script>
    function yesClicked() {
      document.getElementById("question").classList.add("hidden");
      document.getElementById("yesMessage").classList.remove("hidden");
    }

    function noClicked() {
      document.getElementById("question").classList.add("hidden");
      document.getElementById("noMessage").classList.remove("hidden");
    }
  </script>

</body>
</html>
